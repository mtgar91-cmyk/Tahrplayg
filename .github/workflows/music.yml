name: Music Bot

# يُشغَّل فقط من الخارج (بوت المراقبة على orhost) أو يدويا من GitHub.
on:
  workflow_dispatch:

# تشغيل واحد فقط في نفس الوقت
concurrency:
  group: music-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # نسخة ثابتة: ubuntu-latest ينتقل لنسخة جديدة من تلقاء نفسه وقد يكسر البيئة.
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # سبب التعليق الطويل: أمر apt قد يعلق على مرآة بطيئة بلا أي مهلة فيبقى ربع ساعة أو أكثر.
      # الحل: ffmpeg غالبا موجود أصلا (نتخطى التثبيت)، وإلا فكل أمر apt له مهلة خارجية
      # ومهلة شبكة ومحاولات، والخطوة كلها لها سقف 10 دقائق ثم تفشل بوضوح (فيعيد المراقب التشغيل).
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg already installed"
          else
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=60"
            for i in 1 2 3; do
              if sudo timeout 120 apt-get update -qq $APT_OPTS \
                 && sudo timeout 240 apt-get install -y -qq --no-install-recommends $APT_OPTS ffmpeg; then
                break
              fi
              echo "apt failed (attempt $i); retrying in 10s"
              sleep 10
            done
          fi
          command -v ffmpeg >/dev/null 2>&1 || { echo "ffmpeg is not installed"; exit 1; }
          ffprobe -version | head -n 1

      - name: Install dependencies
        timeout-minutes: 10
        run: pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          MAX_RUNTIME_SECONDS: "20400"   # 5 ساعات و40 دقيقة ثم يغلق نفسه
        # exec حتى تصل إشارات الإيقاف (SIGINT/SIGTERM) إلى بايثون مباشرة
        # فيغلق الحساب والمكالمة بشكل صحيح بدون أخطاء
        run: exec python -u main.py
