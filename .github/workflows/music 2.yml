name: Music Bot

# يُشغَّل فقط من الخارج (بوت المراقبة على orhost) أو يدويا من GitHub.
# تم حذف الـ cron وخطوة التشغيل الذاتي لمنع أي تعارض.
on:
  workflow_dispatch:

# تشغيل واحد فقط في نفس الوقت
concurrency:
  group: music-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          MAX_RUNTIME_SECONDS: "20400"   # 5 ساعات و40 دقيقة ثم يغلق نفسه
        run: exec python -u main.py
